<!doctype html><html lang="ja"><meta charset="utf-8">
<title>code_Teacher</title>
<body>
<script>
(() => {
  const toast = document.createElement('div');
  Object.assign(toast.style,{position:'fixed',left:'16px',bottom:'144px',padding:'8px 10px',background:'#000',color:'#fff',font:'12px/1.2 system-ui',opacity:'0',transition:'opacity .15s',zIndex:2147483647});
  document.body.appendChild(toast);
  const say = t => { toast.textContent=t; toast.style.opacity='1'; setTimeout(()=>toast.style.opacity='0',800); };
  const getSrc = () => (document.currentScript && document.currentScript.textContent) || (document.scripts[document.scripts.length-1]||{}).textContent || '';
  const copy = async (txt) => {
    if (!txt) throw new Error('空です');
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(txt);
    const ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.left='-9999px';
    document.body.appendChild(ta); ta.select(); const ok=document.execCommand('copy'); ta.remove();
    if (!ok) throw new Error('execCommand失敗');
  };
  const m = document.createElement('div');
  m.textContent = 'あなたの「やる気」は保存されていません。';
  Object.assign(m.style,{position:'fixed',right:'16px',top:'16px',maxWidth:'44vw',padding:'10px',background:'#fff',border:'1px solid #ddd',font:'14px/1.4 system-ui'});
  document.body.appendChild(m);
  requestAnimationFrame(function tick(){ m.style.filter = `grayscale(${(Date.now()/8000)%1})`; requestAnimationFrame(tick); });
})();
</script>
</body></html>
