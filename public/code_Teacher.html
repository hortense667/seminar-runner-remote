<!doctype html><html lang="ja"><meta charset="utf-8">
<title>code_Teacher</title>
<body>
<script>
(function() {
    // UI Setup
    const container = document.createElement('div');
    container.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:#f0f2f5;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:sans-serif;z-index:9999;padding:20px;box-sizing:border-box;';
    
    const card = document.createElement('div');
    card.style.cssText = 'background:white;padding:30px;border-radius:15px;box-shadow:0 10px 25px rgba(0,0,0,0.1);max-width:500px;width:100%;text-align:center;';
    
    const questionEl = document.createElement('h2');
    questionEl.style.cssText = 'margin-bottom:20px;color:#1a73e8;font-size:1.5rem;';
    
    const optionsContainer = document.createElement('div');
    optionsContainer.style.cssText = 'display:grid;gap:10px;width:100%;';
    
    const scoreEl = document.createElement('div');
    scoreEl.style.cssText = 'margin-top:20px;font-weight:bold;color:#5f6368;';

    card.appendChild(questionEl);
    card.appendChild(optionsContainer);
    card.appendChild(scoreEl);
    container.appendChild(card);
    document.body.appendChild(container);

    // Quiz Data
    const quizData = [
        { q: "JavaScriptで定数を宣言するキーワードは？", a: ["const", "let", "var", "define"], correct: 0 },
        { q: "JSONの正式名称は？", a: ["JavaScript Object Notation", "Java Standard Object Next", "J-Series Online Network", "JavaScript Output News"], correct: 0 },
        { q: "配列の末尾に要素を追加するメソッドは？", a: ["push()", "pop()", "shift()", "add()"], correct: 0 },
        { q: "DOMの正式名称は？", a: ["Document Object Model", "Data Object Management", "Digital One Mode", "Desktop Object Maker"], correct: 0 }
    ];

    let currentIdx = 0;
    let score = 0;

    function loadQuestion() {
        if (currentIdx >= quizData.length) {
            showResult();
            return;
        }

        const data = quizData[currentIdx];
        questionEl.textContent = `Q${currentIdx + 1}: ${data.q}`;
        optionsContainer.innerHTML = '';
        scoreEl.textContent = `現在のスコア: ${score} / ${quizData.length}`;

        data.a.forEach((choice, i) => {
            const btn = document.createElement('button');
            btn.textContent = choice;
            btn.style.cssText = 'padding:15px;font-size:1rem;border:2px solid #e0e0e0;border-radius:8px;background:white;cursor:pointer;transition:0.2s;outline:none;';
            
            // Interaction
            btn.onmouseover = () => btn.style.background = '#f8f9fa';
            btn.onmouseout = () => btn.style.background = 'white';
            
            btn.onclick = () => {
                if (i === data.correct) {
                    score++;
                    btn.style.background = '#d4edda';
                    btn.style.borderColor = '#28a745';
                } else {
                    btn.style.background = '#f8d7da';
                    btn.style.borderColor = '#dc3545';
                }
                
                Array.from(optionsContainer.children).forEach(b => b.disabled = true);
                
                setTimeout(() => {
                    currentIdx++;
                    loadQuestion();
                }, 800);
            };
            optionsContainer.appendChild(btn);
        });
    }

    function showResult() {
        questionEl.textContent = "全問終了！";
        optionsContainer.innerHTML = '';
        scoreEl.innerHTML = `最終スコア: <span style="font-size:2rem;color:#1a73e8;">${score}</span> / ${quizData.length}`;
        
        const retryBtn = document.createElement('button');
        retryBtn.textContent = "最初から遊ぶ";
        retryBtn.style.cssText = 'margin-top:20px;padding:12px 24px;background:#1a73e8;color:white;border:none;border-radius:5px;cursor:pointer;font-size:1rem;';
        retryBtn.onclick = () => {
            currentIdx = 0;
            score = 0;
            loadQuestion();
        };
        optionsContainer.appendChild(retryBtn);
    }

    loadQuestion();
})();
</script>
</body></html>
