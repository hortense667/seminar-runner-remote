<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seminar JS Runner</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans JP", sans-serif; margin: 0; }
    header { padding: 12px 16px; border-bottom: 1px solid #ddd; display:flex; gap:12px; align-items:center; flex-wrap: wrap;}
    main { display: grid; grid-template-columns: 1fr 420px; gap: 12px; padding: 12px; }
    textarea { width: 100%; min-height: 320px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; padding: 10px; box-sizing: border-box; }
    .card { border: 1px solid #ddd; border-radius: 10px; overflow: hidden; }
    .card h3 { margin: 0; padding: 10px 12px; border-bottom: 1px solid #eee; font-size: 14px; background: #fafafa;}
    .card .content { padding: 10px 12px; }
    button { padding: 8px 10px; border-radius: 8px; border: 1px solid #ccc; background: #fff; cursor: pointer; }
    button.primary { background: #111; color: #fff; border-color: #111; }
    button.tint-blue { background:#e9f4ff; border-color:#b7dbff; color:#0b4a7a; }
    button.tint-orange { background:#fff0df; border-color:#ffd0a3; color:#6b3a00; }
    /* subtle but clear ON/OFF (invert on ON) */
    button.soft { background: #f3f3f3; color:#222; border-color:#d5d5d5; }
    button.soft.active-done { background:#2f6f3a; border-color:#2f6f3a; color:#fff; }
    button.soft.active-question { background:#8a6b00; border-color:#8a6b00; color:#fff; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap: wrap;}
    .muted { color:#666; font-size: 12px; }
    #logs { white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.35; max-height: 420px; overflow:auto; }
    #students { max-height: 320px; overflow:auto; }
    .student { padding: 8px 10px; border-bottom: 1px solid #eee; display:flex; align-items:center; gap:10px; }
    .student:hover { background: #fafafa; }
    .student-head { flex: 0 0 auto; min-width: 200px; display:flex; justify-content:space-between; align-items:baseline; gap:10px; cursor: pointer; }
    .student-name { font-weight: 600; }
    .student-meta { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .student-id { font-size: 11px; color:#888; }
    .memo-input { flex: 1 1 auto; min-width: 160px; box-sizing:border-box; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.35; padding: 7px 10px; border:1px solid #ddd; border-radius:10px; background:#fff; height: 34px; }
    .tag { font-size: 11px; padding: 2px 6px; border: 1px solid #ddd; border-radius: 999px; }
    .tag-off { background:#f1f1f1; border-color:#e1e1e1; color:#777; }
    .tag-done-on { background:#2f6f3a; border-color:#2f6f3a; color:#fff; }
    .tag-question-on { background:#8a6b00; border-color:#8a6b00; color:#fff; }
    .pill { font-size: 11px; padding: 2px 6px; border: 1px solid #ddd; border-radius: 999px; color:#333; }
    iframe { width: 100%; height: 260px; border: 0; background:#fff; }
    .danger { color:#a00; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 2000; display:none; padding: 18px; box-sizing: border-box; }
    .modal { max-width: 980px; height: min(80vh, 720px); margin: 0 auto; background:#fff; border:1px solid #ddd; border-radius: 14px; overflow:hidden; box-shadow: 0 16px 48px rgba(0,0,0,0.22); display:flex; flex-direction:column; }
    .modal-head { padding: 10px 12px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center; gap:10px; }
    .modal-body { padding: 10px 12px; overflow:auto; }
    .modal-body pre { margin:0; white-space: pre-wrap; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.45; }
    .maximize-bar { position: fixed; top: 12px; left: 12px; right: 12px; z-index: 1002; display: none; background: #fff; border: 1px solid #ddd; border-radius: 12px; padding: 8px 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    .runner-wrap { border: 1px solid #eee; border-radius: 10px; overflow: hidden; background: #fff; }
    body.maximized { overflow: hidden; }
    body.student-maximized #studentMaxBar { display: flex; }
    body.student-maximized #studentRunnerWrap { position: fixed; inset: 60px 12px 12px 12px; z-index: 1001; border: 1px solid #ddd; border-radius: 12px; background: #fff; padding: 8px; }
    body.student-maximized #studentRunnerWrap iframe { height: 100%; }
    @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<header>
  <strong>Seminar JS Runner</strong>
  <span class="pill" id="rolePill"></span>
  <div class="row">
    <label class="muted">ルーム:</label>
    <input id="room" value="demo" style="padding:6px 8px;border:1px solid #ccc;border-radius:8px;" />
    <label class="muted">なまえ:</label>
    <input id="name" value="" placeholder="任意（例: Tanaka）" style="padding:6px 8px;border:1px solid #ccc;border-radius:8px;" />
    <span class="muted" id="nameHelp"></span>
    <button class="primary" id="connectBtn">Connect</button>
    <a class="muted" id="qrLink" href="/qr.html?room=demo" target="_blank" rel="noopener">QRページ</a>
  </div>
  <span class="muted" id="status"></span>
  <span class="row" id="studentSignalWrap" style="margin-left:auto;display:none;">
    <button class="soft" id="studentDoneBtn" title="講師に「できました」を通知">できました</button>
    <button class="soft" id="studentQuestionBtn" title="講師に「質問あり」を通知">質問あり</button>
  </span>
  <span class="row" id="teacherControlsWrap" style="margin-left:auto;display:none;">
    <label class="muted" style="display:flex;gap:6px;align-items:center;">
      <input type="checkbox" id="teacherShowAllLogs" checked />
      Logs: 全員（OFFで選択者のみ）
    </label>
    <label class="muted" style="display:flex;gap:6px;align-items:center;">
      <input type="checkbox" id="teacherLockName" />
      名前変更禁止
    </label>
    <button id="teacherClearRoomBtn">受講者一覧リセット</button>
  </span>
</header>

<main>
  <section class="card" id="leftCard">
    <h3 id="leftTitle">コード</h3>
    <div class="content">
      <!-- STUDENT -->
      <div id="studentPane">
        <div class="row" style="margin-bottom:8px;">
          <button class="primary" id="runBtn">Run（プログラムを動かす）</button>
          <button class="tint-orange" id="studentMaxBtn">実行画面最大化</button>
          <button id="clearBtn">Logクリア</button>
          <button class="tint-blue" id="clearCodeBtn">Codeクリア</button>
          <button id="extractBtn">HTML→JS抽出</button>
          <button id="studentDlBtn">HTMLでDL</button>
          <button class="soft" id="helpBtn" title="使い方（USERS_GUIDE）">？</button>
        </div>
        <div class="row maximize-bar" id="studentMaxBar">
          <button class="primary" id="runBtnMax">Run（プログラムを動かす）</button>
          <button id="studentRestoreBtn">実行画面を元のサイズに戻す</button>
        </div>
        <textarea id="code" placeholder="// ChatGPTで生成したJSをここに貼り付け
console.log('hello');"></textarea>
        <div class="row" style="margin-top:10px;">
          <span class="muted">実行プレビュー（sandbox iframe）</span>
        </div>
        <div id="studentRunnerWrap" class="runner-wrap">
          <iframe id="runner" sandbox="allow-scripts"></iframe>
        </div>
      </div>

      <!-- TEACHER -->
      <div id="teacherPane" style="display:none;">
        <div class="row" style="margin-bottom:8px;">
          <span class="muted">受講者をクリック → コード/ログ参照。実行は「別タブで実行」をスクリーンに映す。</span>
        </div>

        <div class="card" style="border-radius:10px;">
          <h3>受講者一覧</h3>
          <div class="content" id="students"></div>
        </div>

        <div class="row" style="margin-top:10px;">
          <button id="teacherCopyBtn">コードをコピー</button>
          <button id="teacherDlBtn">HTMLでDL</button>
          <button id="teacherRunPopupBtn">別タブで実行（固まり対策）</button>
          <button id="teacherClosePopupBtn">別タブを閉じる</button>
          <button id="teacherWritebackBtn">Code書き戻し</button>
          <span class="muted" id="teacherSelInfo"></span>
          <span class="pill" id="teacherSelId"></span>
          <button class="soft" id="teacherHelpBtn" title="使い方（USERS_GUIDE）">？</button>
        </div>

        <textarea id="teacherCode" readonly></textarea>

        <div id="teacherWritebackPanel" style="display:none;margin-top:10px;border:1px solid #eee;border-radius:10px;padding:10px;">
          <div class="row" style="margin-bottom:8px;">
            <strong style="font-size:13px;">Code書き戻し</strong>
            <span class="muted" id="teacherWritebackInfo"></span>
          </div>
          <textarea id="teacherWritebackCode" placeholder="// ここに貼り付け → 「送る」で受講者のコードを差し替え（自動実行はしません）"></textarea>
          <div class="row" style="margin-top:8px;">
            <button class="primary" id="teacherWritebackSendBtn">送る</button>
            <button id="teacherWritebackCancelBtn">キャンセル</button>
            <span class="danger" style="font-size:12px;">※ 受講者のコード欄が差し替わりますので十分注意してから送信してください</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <aside class="card">
    <h3>Logs</h3>
    <div class="content">
      <div id="logs"></div>
    </div>
  </aside>
</main>

<div class="modal-backdrop" id="helpModal">
  <div class="modal" role="dialog" aria-modal="true" aria-label="使い方">
    <div class="modal-head">
      <strong style="font-size:13px;">使い方（USERS_GUIDE）</strong>
      <div class="row">
        <button id="helpCloseBtn">閉じる</button>
      </div>
    </div>
    <div class="modal-body">
      <pre id="helpText">読み込み中...</pre>
    </div>
  </div>
</div>

<script>
  const qs = new URLSearchParams(location.search);
  const role = (qs.get("role") === "teacher") ? "teacher" : "student";
  const rolePill = document.getElementById("rolePill");
  rolePill.textContent = role === "teacher" ? "TEACHER" : "STUDENT";

  const roomEl = document.getElementById("room");
  const nameEl = document.getElementById("name");
  const nameHelpEl = document.getElementById("nameHelp");
  const connectBtn = document.getElementById("connectBtn");
  const statusEl = document.getElementById("status");
  const qrLink = document.getElementById("qrLink");
  const studentSignalWrap = document.getElementById("studentSignalWrap");
  const studentDoneBtn = document.getElementById("studentDoneBtn");
  const studentQuestionBtn = document.getElementById("studentQuestionBtn");
  const teacherControlsWrap = document.getElementById("teacherControlsWrap");

  const studentPane = document.getElementById("studentPane");
  const teacherPane = document.getElementById("teacherPane");
  const codeEl = document.getElementById("code");
  const runBtn = document.getElementById("runBtn");
  const runBtnMax = document.getElementById("runBtnMax");
  const studentMaxBtn = document.getElementById("studentMaxBtn");
  const studentRestoreBtn = document.getElementById("studentRestoreBtn");
  const clearBtn = document.getElementById("clearBtn");
  const clearCodeBtn = document.getElementById("clearCodeBtn");
  const extractBtn = document.getElementById("extractBtn");
  const studentDlBtn = document.getElementById("studentDlBtn");
  const helpBtn = document.getElementById("helpBtn");
  const helpModal = document.getElementById("helpModal");
  const helpCloseBtn = document.getElementById("helpCloseBtn");
  const helpText = document.getElementById("helpText");
  const runner = document.getElementById("runner");
  const logsEl = document.getElementById("logs");

  const studentsEl = document.getElementById("students");
  const teacherCodeEl = document.getElementById("teacherCode");
  const teacherCopyBtn = document.getElementById("teacherCopyBtn");
  const teacherDlBtn = document.getElementById("teacherDlBtn");
  const teacherRunPopupBtn = document.getElementById("teacherRunPopupBtn");
  const teacherClosePopupBtn = document.getElementById("teacherClosePopupBtn");
  const teacherWritebackBtn = document.getElementById("teacherWritebackBtn");
  const teacherWritebackPanel = document.getElementById("teacherWritebackPanel");
  const teacherWritebackInfo = document.getElementById("teacherWritebackInfo");
  const teacherWritebackCode = document.getElementById("teacherWritebackCode");
  const teacherWritebackSendBtn = document.getElementById("teacherWritebackSendBtn");
  const teacherWritebackCancelBtn = document.getElementById("teacherWritebackCancelBtn");
  const teacherShowAllLogs = document.getElementById("teacherShowAllLogs");
  const teacherLockName = document.getElementById("teacherLockName");
  const teacherClearRoomBtn = document.getElementById("teacherClearRoomBtn");
  const teacherSelInfo = document.getElementById("teacherSelInfo");
  const teacherSelId = document.getElementById("teacherSelId");
  const teacherHelpBtn = document.getElementById("teacherHelpBtn");

  if (role === "teacher") {
    studentPane.style.display = "none";
    teacherPane.style.display = "block";
    document.getElementById("leftTitle").textContent = "講師ダッシュボード";
    if (studentSignalWrap) studentSignalWrap.style.display = "none";
    if (teacherControlsWrap) teacherControlsWrap.style.display = "flex";
  } else {
    if (studentSignalWrap) studentSignalWrap.style.display = "flex";
    if (teacherControlsWrap) teacherControlsWrap.style.display = "none";
  }

  // Persistent clientId per device
  const clientIdKey = "seminar_client_id_v1";
  let clientId = localStorage.getItem(clientIdKey);
  if (!clientId) {
    clientId = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(16).slice(2));
    localStorage.setItem(clientIdKey, clientId);
  }

  // remember last room/name
  roomEl.value = localStorage.getItem("seminar_room") || roomEl.value;
  nameEl.value = filterDisplayName(localStorage.getItem("seminar_name") || nameEl.value);

  let ws = null;
  let selectedStudentId = null;
  const teacherState = new Map(); // clientId -> {name, code, logs, lastSeen}
  let roomNameLocked = false;
  let teacherPopupWin = null;
  const memoSendTimers = new Map(); // clientId -> timeoutId
  let memoFocusState = null; // {clientId, selectionStart, selectionEnd, scrollLeft}
  let isRenderingStudents = false;
  let isMemoComposing = false;
  let renderStudentsTimer = null;
  let studentSignal = ""; // "" | "done" | "question"
  let writebackTargetId = null;
  let writebackPendingTimer = null;
  let helpLoaded = false;

  function scheduleRenderStudents() {
    if (role !== "teacher") return;
    if (renderStudentsTimer) return;
    renderStudentsTimer = setTimeout(() => {
      renderStudentsTimer = null;
      if (isMemoComposing) {
        scheduleRenderStudents();
        return;
      }
      renderStudents();
    }, 80);
  }

  function setStatus(txt) { statusEl.textContent = txt; }

  function appendLog(line) {
    logsEl.textContent += line + "\n";
    logsEl.scrollTop = logsEl.scrollHeight;
  }

  function clearLogsUI() { logsEl.textContent = ""; }

  function supportsUnicodeProps() {
    try { new RegExp("\\p{L}", "u"); return true; } catch { return false; }
  }

  function filterDisplayName(raw) {
    const text = String(raw || "").normalize("NFKC");
    // allow: letters/numbers (any script), space, underscore, hyphen, ・, ー
    const re = supportsUnicodeProps()
      ? /[^\p{L}\p{N} _\-・ー]/gu
      : /[^A-Za-z0-9 _\-ぁ-んァ-ヶ\u3400-\u9FFF\uF900-\uFAFF・ー]/g;
    let out = text.replace(re, "");
    out = out.replace(/\s+/g, " ").trim();
    if (out.length > 40) out = out.slice(0, 40);
    return out;
  }

  function sanitizeForFilename(name) {
    // Windows forbidden: \ / : * ? " < > | + control chars
    let out = String(name || "").normalize("NFKC").trim();
    out = out.replace(/[\\\/:*?"<>|\x00-\x1F]/g, "");
    out = out.replace(/\s+/g, " ").trim();
    out = out.replace(/[\. ]+$/g, ""); // no trailing dot/space (Windows)
    if (!out) out = "student_code";
    // reserved device names (Windows)
    const upper = out.toUpperCase();
    if (/^(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])(\..*)?$/.test(upper)) out = "_" + out;
    if (out.length > 80) out = out.slice(0, 80);
    return out;
  }

  function timestampForFilename(d = new Date()) {
    const pad = (n, w = 2) => String(n).padStart(w, "0");
    const yyyy = d.getFullYear();
    const mm = pad(d.getMonth() + 1);
    const dd = pad(d.getDate());
    const hh = pad(d.getHours());
    const mi = pad(d.getMinutes());
    const ss = pad(d.getSeconds());
    const ms = pad(d.getMilliseconds(), 3);
    return `${yyyy}${mm}${dd}_${hh}${mi}${ss}_${ms}`;
  }

  function applyNameLock() {
    const locked = !!roomNameLocked;
    if (nameEl) nameEl.disabled = locked;
    if (nameHelpEl) nameHelpEl.textContent = locked ? "（講師が名前変更を禁止中）" : "";
  }

  function openPopupRunner(kind, code, title) {
    const w = window.open("", "_blank", "width=980,height=720");
    if (!w) {
      appendLog("[warn] 別タブ（ポップアップ）を開けませんでした。ブラウザのポップアップブロック設定をご確認ください。");
      return null;
    }
    const safeTitle = String(title || "Runner");
    const html = `<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>${safeTitle}</title>
<style>
  body{font-family:system-ui,-apple-system,Segoe UI,Roboto,"Noto Sans JP",sans-serif;margin:0;padding:12px;}
  .muted{color:#666;font-size:12px;}
  pre{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;line-height:1.35;border:1px solid #eee;border-radius:10px;padding:10px;max-height:40vh;overflow:auto;}
</style>
</head><body>
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;">
  <strong>${safeTitle}</strong>
  <span class="muted">（無限ループなどで固まったら、このタブを閉じてください）</span>
</div>
<pre id="log"></pre>
<script>
(function(){
  const logEl = document.getElementById("log");
  const send = (level, args) => {
    try {
      window.opener && window.opener.postMessage({__popup_runner:true, kind:${JSON.stringify(kind)}, level, args}, "*");
    } catch(e) {}
  };
  const append = (level, args) => {
    try {
      const line = "[" + level + "] " + (args||[]).map(a => {
        try { return (typeof a === "string") ? a : JSON.stringify(a); } catch(e){ return String(a); }
      }).join(" ");
      logEl.textContent += line + "\\n";
      logEl.scrollTop = logEl.scrollHeight;
    } catch(e) {}
  };
  const wrap = (fnName) => {
    const orig = console[fnName];
    console[fnName] = (...args) => {
      send(fnName, args);
      append(fnName, args);
      orig && orig.apply(console, args);
    };
  };
  ["log","info","warn","error"].forEach(wrap);
  window.addEventListener("error", (e) => {
    send("error", [String(e.message || e.error || e)]);
    append("error", [String(e.message || e.error || e)]);
  });
  window.addEventListener("unhandledrejection", (e) => {
    send("error", [String(e.reason || e)]);
    append("error", [String(e.reason || e)]);
  });
})();
<\/script>
<script>
${code}
<\/script>
</body></html>`;
    w.document.open();
    w.document.write(html);
    w.document.close();
    return w;
  }

  function applyStudentSignalUI() {
    if (!studentDoneBtn || !studentQuestionBtn) return;
    studentDoneBtn.classList.toggle("active-done", studentSignal === "done");
    studentQuestionBtn.classList.toggle("active-question", studentSignal === "question");
  }

  function setStudentSignal(next) {
    studentSignal = next || "";
    applyStudentSignalUI();
    if (role !== "student") return;
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: "signal_update", signal: studentSignal }));
  }

  async function openHelp() {
    if (!helpModal || !helpText) return;
    helpModal.style.display = "block";
    if (helpLoaded) return;
    try {
      const res = await fetch("/api/users_guide", { cache: "no-store" });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const txt = await res.text();
      helpText.textContent = txt;
      helpLoaded = true;
    } catch (e) {
      helpText.textContent = `読み込みに失敗しました: ${String(e?.message || e)}\n\n※ サーバが起動しているか確認してください。`;
    }
  }

  function closeHelp() {
    if (!helpModal) return;
    helpModal.style.display = "none";
  }

  // ---------- Student runner (sandbox iframe, console forwarding to parent -> WS) ----------
  function runStudentCode(code) {
    const srcdoc = `
<!doctype html><html><head><meta charset="utf-8"></head><body>
<script>
(function(){
  const send = (type, payload) => parent.postMessage({__runner: true, type, payload}, "*");
  const wrap = (fnName) => {
    const orig = console[fnName];
    console[fnName] = (...args) => {
      try { send("log", {level: fnName, args}); } catch(e) {}
      orig.apply(console, args);
    };
  }
  ;
  ["log","info","warn","error"].forEach(wrap);
  window.addEventListener("error", (e) => {
    send("log", {level:"error", args:[String(e.message || e.error || e)]});
  });
  window.addEventListener("unhandledrejection", (e) => {
    send("log", {level:"error", args:[String(e.reason || e)]});
  });
})();
<\/script>
<script>
${code}
<\/script>
</body></html>`;
    runner.srcdoc = srcdoc;
  }

  window.addEventListener("message", (ev) => {
    // popup runner log
    if (ev.data && ev.data.__popup_runner) {
      const { kind, level, args } = ev.data;
      if (kind === "teacher" && role === "teacher") {
        const line = `[teacher:${level}] ` + (args || []).map(a => {
          try { return typeof a === "string" ? a : JSON.stringify(a); } catch { return String(a); }
        }).join(" ");
        appendLog(line);
        return;
      }
    }

    // student preview log -> send to server
    if (ev.data && ev.data.__runner && role === "student") {
      if (ev.data.type === "log") {
        const { level, args } = ev.data.payload || {};
        const line = `[${level}] ` + (args || []).map(a => {
          try { return typeof a === "string" ? a : JSON.stringify(a); } catch { return String(a); }
        }).join(" ");
        appendLog(line);
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: "log", line }));
        }
      }
      return;
    }

    // teacher iframe preview log (removed)
  });

  // ---------- Runボタンのみ運用 ----------
  // inputでは「共有（code_update）」だけ。自動実行しない
  codeEl?.addEventListener("input", () => {
    if (role !== "student") return;
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: "code_update", code: codeEl.value }));
  });

  studentDoneBtn?.addEventListener("click", () => {
    if (role !== "student") return;
    setStudentSignal(studentSignal === "done" ? "" : "done");
  });

  studentQuestionBtn?.addEventListener("click", () => {
    if (role !== "student") return;
    setStudentSignal(studentSignal === "question" ? "" : "question");
  });

  helpBtn?.addEventListener("click", () => {
    // student-only button (but safe even if hidden)
    openHelp();
  });

  teacherHelpBtn?.addEventListener("click", () => {
    openHelp();
  });

  helpCloseBtn?.addEventListener("click", closeHelp);
  helpModal?.addEventListener("click", (e) => {
    if (e.target === helpModal) closeHelp();
  });
  window.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeHelp();
  });

  // name: filename-safe-ish characters only + (if connected) share update
  nameEl?.addEventListener("input", () => {
    const filtered = filterDisplayName(nameEl.value);
    if (filtered !== nameEl.value) nameEl.value = filtered;
    localStorage.setItem("seminar_name", nameEl.value);
    if (role !== "student") return;
    if (roomNameLocked) return;
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: "name_update", name: (nameEl.value || "").trim() }));
  });

  function setTeacherWritebackOpen(open) {
    if (!teacherWritebackPanel) return;
    teacherWritebackPanel.style.display = open ? "block" : "none";
  }

  teacherWritebackBtn?.addEventListener("click", () => {
    if (role !== "teacher") return;
    if (!selectedStudentId) {
      alert("受講者を先に選択してください（受講者一覧の名前をクリック）。");
      return;
    }
    writebackTargetId = selectedStudentId;
    const s = teacherState.get(selectedStudentId) || {};
    if (teacherWritebackInfo) {
      teacherWritebackInfo.textContent = `送信先: ${s.name || "Student"}`;
    }
    if (teacherWritebackCode) {
      teacherWritebackCode.value = teacherCodeEl.value || "";
      teacherWritebackCode.focus();
    }
    setTeacherWritebackOpen(true);
  });

  teacherWritebackCancelBtn?.addEventListener("click", () => {
    if (role !== "teacher") return;
    writebackTargetId = null;
    if (writebackPendingTimer) { clearTimeout(writebackPendingTimer); writebackPendingTimer = null; }
    if (teacherWritebackSendBtn) teacherWritebackSendBtn.disabled = false;
    setTeacherWritebackOpen(false);
  });

  teacherWritebackSendBtn?.addEventListener("click", () => {
    if (role !== "teacher") return;
    const targetId = writebackTargetId || selectedStudentId;
    if (!targetId) {
      alert("送信先が未選択です。受講者一覧から選択してください。");
      return;
    }
    if (!ws || ws.readyState !== WebSocket.OPEN) {
      alert("未接続です（WebSocketが未接続）。Connect後にお試しください。");
      return;
    }
    const code = teacherWritebackCode?.value || "";
    if (teacherWritebackSendBtn) teacherWritebackSendBtn.disabled = true;
    try {
      ws.send(JSON.stringify({ type: "force_code", clientId: targetId, code }));
    } catch {
      if (teacherWritebackSendBtn) teacherWritebackSendBtn.disabled = false;
      alert("送信に失敗しました。");
      return;
    }
    // If no response comes back, allow retry
    if (writebackPendingTimer) clearTimeout(writebackPendingTimer);
    writebackPendingTimer = setTimeout(() => {
      writebackPendingTimer = null;
      if (teacherWritebackSendBtn) teacherWritebackSendBtn.disabled = false;
      alert("送信結果が返ってきませんでした（タイムアウト）。接続状況をご確認ください。");
    }, 3000);
  });

  function runStudent() {
    if (role !== "student") return;
    const code = codeEl.value;

    clearLogsUI();
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: "code_update", code }));
      ws.send(JSON.stringify({ type: "clear_logs" }));
    }
    runStudentCode(code);
  }

  runBtn?.addEventListener("click", runStudent);
  runBtnMax?.addEventListener("click", runStudent);

  clearBtn?.addEventListener("click", () => {
    clearLogsUI();
    if (ws && ws.readyState === WebSocket.OPEN && role === "student") {
      ws.send(JSON.stringify({ type: "clear_logs" }));
    }
  });

  
  // ---------- Clear code (student) ----------
  clearCodeBtn?.addEventListener("click", () => {
    if (role !== "student") return;

    codeEl.value = "";

    // share cleared code to teacher
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: "code_update", code: "" }));
    }

    // clear preview
    runner.srcdoc = '<!doctype html><meta charset="utf-8"><body></body>';

    appendLog("[info] code cleared");
  });

  // ---------- Extract inline <script> from HTML in code area (student) ----------
  extractBtn?.addEventListener("click", () => {
    if (role !== "student") return;
    const text = codeEl.value || "";

    if (!/<script[\s>]/i.test(text)) {
      appendLog("[warn] <script> が見つかりません（HTMLを貼ってください）");
      return;
    }

    const doc = new DOMParser().parseFromString(text, "text/html");
    const scripts = Array.from(doc.querySelectorAll("script"))
      .filter(s => !s.src)
      .map(s => (s.textContent || "").trim())
      .filter(Boolean);

    if (!scripts.length) {
      appendLog("[warn] インラインscriptが見つかりません（src付きは無視します）");
      return;
    }

    const js = scripts.join("\n\n");
    codeEl.value = js;

    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: "code_update", code: js }));
    }

    appendLog("[info] HTMLからJSを抽出しました（Runで実行してください）");
  });

  // ---------- Student: download HTML from current code ----------
  studentDlBtn?.addEventListener("click", () => {
    if (role !== "student") return;
    const code = codeEl.value || "";
    if (!code.trim()) return;
    const base = `code_${timestampForFilename()}`;
    downloadHtmlFromCode(code, base);
  });

// ---------- Teacher: download HTML from selected student's code ----------
  function downloadHtmlFromCode(code, filenameBase = "student_code") {
    const safe = sanitizeForFilename(filenameBase || "student_code");
    const safeCode = String(code || "").replace(/<\/script>/gi, "<\\/script>");
    const html = `<!doctype html><html lang="ja"><meta charset="utf-8">
<title>${safe}</title>
<body>
<script>
${safeCode}
<\/script>
</body></html>`;
    const blob = new Blob([html], { type: "text/html" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${safe}.html`;
    a.click();
    URL.revokeObjectURL(url);
  }

  teacherCopyBtn?.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(teacherCodeEl.value || "");
      teacherSelInfo.textContent = (teacherSelInfo.textContent || "") + " / copied";
    } catch {}
  });

  teacherDlBtn?.addEventListener("click", () => {
    const code = teacherCodeEl.value || "";
    if (!code.trim()) return;
    const s = teacherState.get(selectedStudentId) || {};
    const base = (s.name ? `code_${s.name}` : "student_code");
    downloadHtmlFromCode(code, base);
  });

  // ---------- Teacher: run preview removed (use popup) ----------

  teacherRunPopupBtn?.addEventListener("click", () => {
    if (role !== "teacher") return;
    const code = teacherCodeEl.value || "";
    if (!code.trim()) return;
    clearLogsUI();
    if (teacherPopupWin && !teacherPopupWin.closed) {
      try { teacherPopupWin.close(); } catch {}
    }
    teacherPopupWin = openPopupRunner("teacher", code, "Teacher Runner (popup)");
  });

  teacherClosePopupBtn?.addEventListener("click", () => {
    if (teacherPopupWin && !teacherPopupWin.closed) {
      try { teacherPopupWin.close(); } catch {}
    }
    teacherPopupWin = null;
  });

  teacherLockName?.addEventListener("change", () => {
    if (role !== "teacher") return;
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    ws.send(JSON.stringify({ type: "set_name_lock", locked: !!teacherLockName.checked }));
  });

  teacherClearRoomBtn?.addEventListener("click", () => {
    if (role !== "teacher") return;
    if (!ws || ws.readyState !== WebSocket.OPEN) return;
    const ok = confirm("受講者一覧をリセットします。\nこの部屋のコード/ログのサーバ保持分が削除されます。\nよろしいですか？");
    if (!ok) return;
    selectedStudentId = null;
    teacherCodeEl.value = "";
    teacherSelInfo.textContent = "（リセット中）";
    clearLogsUI();
    ws.send(JSON.stringify({ type: "clear_room" }));
  });

  function setMaximized(kind, on) {
    document.body.classList.toggle("maximized", on);
    document.body.classList.toggle(`${kind}-maximized`, on);
  }

  studentMaxBtn?.addEventListener("click", () => setMaximized("student", true));
  studentRestoreBtn?.addEventListener("click", () => setMaximized("student", false));

  // teacher maximize removed (popup is projection-friendly)

  // ---------- Teacher UI render ----------
  function renderStudents() {
    if (role !== "teacher") return;
    if (!studentsEl) return;
    isRenderingStudents = true;
    try {

    const listScrollTop = studentsEl.scrollTop;
    const active = document.activeElement;
    const hadMemoFocus = active && active.tagName === "INPUT" && active.dataset && active.dataset.memoFor;
    if (hadMemoFocus) {
      memoFocusState = {
        clientId: active.dataset.memoFor,
        selectionStart: active.selectionStart,
        selectionEnd: active.selectionEnd,
        scrollLeft: active.scrollLeft
      };
    } else {
      memoFocusState = null;
    }

    const arr = [...teacherState.entries()]
      .map(([id, s]) => ({ id, ...s }))
      .sort((a,b) => (b.lastSeen||0) - (a.lastSeen||0));

    studentsEl.innerHTML = "";
    for (const s of arr) {
      const row = document.createElement("div");
      row.className = "student";

      const head = document.createElement("div");
      head.className = "student-head";

      const left = document.createElement("div");
      left.style.display = "flex";
      left.style.gap = "8px";
      left.style.alignItems = "baseline";

      const name = document.createElement("span");
      name.className = "student-name";
      name.textContent = s.name || "Student";

      left.appendChild(name);

      const right = document.createElement("div");
      right.className = "student-meta";
      const ago = s.lastSeen ? `${Math.round((Date.now()-s.lastSeen)/1000)}s ago` : "";
      if (ago) {
        const agoEl = document.createElement("span");
        agoEl.className = "muted";
        agoEl.textContent = ago;
        right.appendChild(agoEl);
      }

      const doneTag = document.createElement("span");
      doneTag.className = "tag " + (s.signal === "done" ? "tag-done-on" : "tag-off");
      doneTag.textContent = "できました";
      right.appendChild(doneTag);

      const qTag = document.createElement("span");
      qTag.className = "tag " + (s.signal === "question" ? "tag-question-on" : "tag-off");
      qTag.textContent = "質問あり";
      right.appendChild(qTag);

      head.appendChild(left);
      head.appendChild(right);

      head.onclick = () => {
        selectedStudentId = s.id;
        teacherCodeEl.value = s.code || "";
        clearLogsUI();
        (s.logs || []).forEach(line => appendLog(line));
        teacherSelInfo.textContent = `選択: ${s.name || "Student"}`;
        if (teacherSelId) teacherSelId.textContent = s.id ? `id: ${s.id}` : "";
      };

      const memo = document.createElement("input");
      memo.type = "text";
      memo.className = "memo-input";
      memo.placeholder = "メモ（講師のみ）例）欠席 / PCトラブル / 質問…";
      memo.dataset.memoFor = s.id;
      memo.value = String(s.memo || "");
      // フォーカスが外れているときは常に先頭表示に戻す
      memo.scrollLeft = 0;

      memo.addEventListener("click", (e) => e.stopPropagation());
      memo.addEventListener("compositionstart", () => { isMemoComposing = true; });
      memo.addEventListener("compositionend", () => { isMemoComposing = false; });
      memo.addEventListener("focus", () => {
        memoFocusState = {
          clientId: s.id,
          selectionStart: memo.selectionStart,
          selectionEnd: memo.selectionEnd,
          scrollLeft: memo.scrollLeft
        };
      });
      memo.addEventListener("blur", () => {
        // 「他の操作に移ったら先頭から見える分だけ」を保証
        memo.scrollLeft = 0;
        // 再描画中の blur（要素置換）ではフォーカス復元したいので消さない
        if (!isRenderingStudents) memoFocusState = null;
      });

      memo.addEventListener("input", () => {
        const next = String(memo.value || "").slice(0, 1000); // safety limit
        if (next !== memo.value) memo.value = next;

        const cur = teacherState.get(s.id) || { logs: [] };
        cur.memo = next;
        teacherState.set(s.id, cur);

        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        const prevTimer = memoSendTimers.get(s.id);
        if (prevTimer) clearTimeout(prevTimer);
        memoSendTimers.set(s.id, setTimeout(() => {
          try {
            ws.send(JSON.stringify({ type: "memo_update", clientId: s.id, memo: next }));
          } catch {}
        }, 350));
      });

      row.appendChild(head);
      row.appendChild(memo);
      studentsEl.appendChild(row);
    }

    studentsEl.scrollTop = listScrollTop;
    if (memoFocusState && memoFocusState.clientId) {
      const el = studentsEl.querySelector(`input[data-memo-for="${memoFocusState.clientId}"]`);
      if (el) {
        el.focus();
        try { el.setSelectionRange(memoFocusState.selectionStart, memoFocusState.selectionEnd); } catch {}
        el.scrollLeft = memoFocusState.scrollLeft || 0;
      }
    }
    } finally {
      isRenderingStudents = false;
    }
  }

  // ---------- WS connect ----------
  function connect() {
    const room = (roomEl.value || "demo").trim();
    if (nameEl) nameEl.value = filterDisplayName(nameEl.value);
    const name = (nameEl.value || "").trim() || (role === "teacher" ? "Teacher" : "Student");
    localStorage.setItem("seminar_room", room);
    localStorage.setItem("seminar_name", name);

    // QR link update
    if (qrLink) qrLink.href = `/qr.html?room=${encodeURIComponent(room)}`;

    const wsProto = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(`${wsProto}//${location.host}`);
    setStatus("Connecting...");

    ws.onopen = () => {
      setStatus("Connected");
      ws.send(JSON.stringify({
        type: "join",
        role,
        room,
        name,
        clientId: role === "student" ? clientId : null
      }));
      if (role === "student") {
        ws.send(JSON.stringify({ type: "code_update", code: codeEl.value || "" }));
        setStudentSignal(""); // reset on connect
      }
    };

    ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }

      if (msg.type === "room_state") {
        roomNameLocked = !!msg.nameLock;
        applyNameLock();
        if (role === "teacher" && teacherLockName) {
          teacherLockName.checked = !!roomNameLocked;
        }
        return;
      }

      if (msg.type === "name_update_rejected" && role === "student") {
        if (msg.reason === "locked") {
          roomNameLocked = true;
          applyNameLock();
          appendLog("[warn] 講師が名前変更を禁止中のため、名前変更は反映されませんでした。");
        }
        return;
      }

      if (msg.type === "force_code" && role === "student") {
        const code = String(msg.code || "");
        codeEl.value = code;
        // share to teacher (programmatic set doesn't trigger input event)
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: "code_update", code }));
        }
        appendLog("[info] 講師がコードを書き戻しました（自動実行はしません）");
        return;
      }

      if (role === "teacher") {
        if (msg.type === "force_code_result") {
          if (writebackPendingTimer) { clearTimeout(writebackPendingTimer); writebackPendingTimer = null; }
          if (teacherWritebackSendBtn) teacherWritebackSendBtn.disabled = false;
          if (msg.ok) {
            setTeacherWritebackOpen(false);
            writebackTargetId = null;
          } else {
            const reason = msg.reason || "unknown";
            alert(`書き戻しに失敗しました: ${reason}`);
          }
        }
        if (msg.type === "snapshot") {
          teacherState.clear();
          (msg.students || []).forEach(s => teacherState.set(s.clientId, s));
          scheduleRenderStudents();
        }
        if (msg.type === "signal_update") {
          const s = teacherState.get(msg.clientId) || { logs: [] };
          s.signal = msg.signal || "";
          s.lastSeen = msg.lastSeen || s.lastSeen;
          teacherState.set(msg.clientId, s);
          scheduleRenderStudents();
        }
        if (msg.type === "memo_update") {
          const s = teacherState.get(msg.clientId) || { logs: [] };
          s.memo = String(msg.memo || "");
          teacherState.set(msg.clientId, s);
          scheduleRenderStudents();
        }
        if (msg.type === "name_update") {
          const s = teacherState.get(msg.clientId) || { logs: [] };
          s.name = msg.name;
          s.lastSeen = msg.lastSeen;
          teacherState.set(msg.clientId, s);
          scheduleRenderStudents();
        }
        if (msg.type === "student_joined") {
          teacherState.set(msg.clientId, { name: msg.name, code: "", logs: [], memo: "", lastSeen: msg.lastSeen });
          scheduleRenderStudents();
        }
        if (msg.type === "student_left") {
          const s = teacherState.get(msg.clientId) || {};
          s.lastSeen = msg.lastSeen;
          teacherState.set(msg.clientId, s);
          scheduleRenderStudents();
        }
        if (msg.type === "code_update") {
          const s = teacherState.get(msg.clientId) || { logs: [] };
          s.name = msg.name;
          s.code = msg.code;
          s.lastSeen = msg.lastSeen;
          teacherState.set(msg.clientId, s);

          if (selectedStudentId === msg.clientId) {
            teacherCodeEl.value = msg.code || "";
          }
          scheduleRenderStudents();
        }
        if (msg.type === "log") {
          const s = teacherState.get(msg.clientId) || { logs: [] };
          s.name = msg.name;
          s.logs = (s.logs || []).slice(-400);
          s.logs.push(msg.line);
          s.lastSeen = msg.lastSeen;
          teacherState.set(msg.clientId, s);
        
          const showAll = teacherShowAllLogs?.checked;
        
          if (showAll) {
            // 全員分を流す（誰のログか分かるように名前を付ける）
            appendLog(`[${s.name || "Student"}] ${msg.line}`);
          } else {
            // 選択者のみ表示（従来仕様）
            if (selectedStudentId === msg.clientId) appendLog(msg.line);
          }
        
          scheduleRenderStudents();
        }
        if (msg.type === "clear_logs") {
          const s = teacherState.get(msg.clientId);
          if (s) {
            s.logs = [];
            s.lastSeen = msg.lastSeen;
            teacherState.set(msg.clientId, s);
        
            const showAll = teacherShowAllLogs?.checked;
        
            if (showAll) {
              appendLog(`[${s.name || "Student"}] (logs cleared)`);
            } else {
              if (selectedStudentId === msg.clientId) clearLogsUI();
            }
        
            scheduleRenderStudents();
          }
        }
      }
    };

    ws.onclose = () => setStatus("Disconnected");
    ws.onerror = () => setStatus("Error");
  }

  connectBtn.addEventListener("click", () => connect());
  connect();
</script>
</body>
</html>
