  // ---------- Teacher UI render ----------
  function renderStudents() {
    if (role !== "teacher") return;
    if (!studentsEl) return;
    isRenderingStudents = true;
    try {

    const listScrollTop = studentsEl.scrollTop;
    const active = document.activeElement;
    const hadMemoFocus = active && active.tagName === "INPUT" && active.dataset && active.dataset.memoFor;
    const hadUrlFocus = active && active.tagName === "INPUT" && active.dataset && active.dataset.urlFor && active.dataset.urlSlot;
    if (hadMemoFocus) {
      memoFocusState = {
        clientId: active.dataset.memoFor,
        selectionStart: active.selectionStart,
        selectionEnd: active.selectionEnd,
        scrollLeft: active.scrollLeft
      };
    } else {
      memoFocusState = null;
    }
    if (hadUrlFocus) {
      urlFocusState = {
        clientId: active.dataset.urlFor,
        slot: active.dataset.urlSlot,
        selectionStart: active.selectionStart,
        selectionEnd: active.selectionEnd,
        scrollLeft: active.scrollLeft
      };
    } else {
      urlFocusState = null;
    }

    studentsEl.innerHTML = "";
    ensureSeatCapacity(teacherSeatCount);
    for (let i = 0; i < teacherSeatCount; i++) {
      const clientId = seatAssignments[i] || null;
      const seatKey = clientId || `seat_${i + 1}`;
      const connected = !!clientId;
      const s = connected ? (teacherState.get(clientId) || { logs: [] }) : {};
      const d = getSeatDraft(i);
      const row = document.createElement("div");
      row.className = "student";

      const head = document.createElement("div");
      head.className = "student-head";

      const left = document.createElement("div");
      left.style.display = "flex";
      left.style.gap = "8px";
      left.style.alignItems = "baseline";

      const name = document.createElement("span");
      name.className = "student-name";
      name.textContent = connected ? (s.name || `受講者${i + 1}`) : `${i + 1}. （未接続）`;

      left.appendChild(name);

      const right = document.createElement("div");
      right.className = "student-meta";
      const ago = connected && s.lastSeen ? `${Math.round((Date.now()-s.lastSeen)/1000)}s ago` : "";
      if (ago) {
        const agoEl = document.createElement("span");
        agoEl.className = "muted";
        agoEl.textContent = ago;
        right.appendChild(agoEl);
      }

      const doneTag = document.createElement("span");
      doneTag.className = "tag " + (s.signal === "done" ? "tag-done-on" : "tag-off");
      doneTag.textContent = "できました";
      right.appendChild(doneTag);

      const qTag = document.createElement("span");
      qTag.className = "tag " + (s.signal === "question" ? "tag-question-on" : "tag-off");
      qTag.textContent = "質問あり";
      right.appendChild(qTag);

      head.appendChild(left);
      head.appendChild(right);

      if (connected) {
        head.onclick = () => {
          applyTeacherSelection(clientId, s);
        };
      }

      const memo = document.createElement("input");
      memo.type = "text";
      memo.className = "memo-input";
      memo.placeholder = "メモ（講師のみ）例）欠席 / PCトラブル / 質問…";
      memo.dataset.memoFor = seatKey;
      memo.value = String(connected ? (s.memo ?? d.memo ?? "") : (d.memo || ""));
      // フォーカスが外れているときは常に先頭表示に戻す
      memo.scrollLeft = 0;

      memo.addEventListener("click", (e) => e.stopPropagation());
      memo.addEventListener("compositionstart", () => { isMemoComposing = true; });
      memo.addEventListener("compositionend", () => { isMemoComposing = false; });
      memo.addEventListener("focus", () => {
        memoFocusState = {
          clientId: seatKey,
          selectionStart: memo.selectionStart,
          selectionEnd: memo.selectionEnd,
          scrollLeft: memo.scrollLeft
        };
      });
      memo.addEventListener("blur", () => {
        // 「他の操作に移ったら先頭から見える分だけ」を保証
        memo.scrollLeft = 0;
        // 再描画中の blur（要素置換）ではフォーカス復元したいので消さない
        if (!isRenderingStudents) memoFocusState = null;
      });

      memo.addEventListener("input", () => {
        const next = String(memo.value || "").slice(0, 1000); // safety limit
        if (next !== memo.value) memo.value = next;

        d.memo = next;
        if (connected) {
          const cur = teacherState.get(clientId) || { logs: [] };
          cur.memo = next;
          teacherState.set(clientId, cur);
        }

        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        try { ws.send(JSON.stringify({ type: "seat_plan_update", seatIndex: i, memo: d.memo || "" })); } catch {}
        if (!connected) return;
        const prevTimer = memoSendTimers.get(clientId);
        if (prevTimer) clearTimeout(prevTimer);
        memoSendTimers.set(clientId, setTimeout(() => {
          try {
            ws.send(JSON.stringify({ type: "memo_update", clientId, memo: next }));
          } catch {}
        }, 350));
      });

      const fields = document.createElement("div");
      fields.className = "student-fields";

      fields.appendChild(memo);

      const url1Wrap = document.createElement("div");
      url1Wrap.className = "url-edit";
      const url1Label = document.createElement("span");
      url1Label.className = "muted";
      url1Label.textContent = "URL1";
      const url1 = document.createElement("input");
      url1.type = "text";
      url1.className = "url-input";
      url1.placeholder = "https://...";
      url1.dataset.urlFor = seatKey;
      url1.dataset.urlSlot = "url1";
      url1.value = String(connected ? (s.url1 ?? d.url1 ?? "") : (d.url1 || ""));
      const url1Open = document.createElement("button");
      url1Open.textContent = "開く";
      url1Open.addEventListener("click", (e) => {
        e.stopPropagation();
        openUrlInNewTab(url1.value);
      });
      url1.addEventListener("click", (e) => e.stopPropagation());
      url1.addEventListener("compositionstart", () => { isMemoComposing = true; });
      url1.addEventListener("compositionend", () => { isMemoComposing = false; });
      url1.addEventListener("focus", () => {
        urlFocusState = {
          clientId: seatKey,
          slot: "url1",
          selectionStart: url1.selectionStart,
          selectionEnd: url1.selectionEnd,
          scrollLeft: url1.scrollLeft
        };
      });
      url1.addEventListener("blur", () => {
        if (!isRenderingStudents) urlFocusState = null;
      });
      url1.addEventListener("input", () => {
        const next = normalizeUrlValue(url1.value);
        if (next !== url1.value) url1.value = next;
        d.url1 = next;
        if (connected) {
          const cur = teacherState.get(clientId) || { logs: [] };
          cur.url1 = next;
          teacherState.set(clientId, cur);
        }
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        try { ws.send(JSON.stringify({ type: "seat_plan_update", seatIndex: i, url1: d.url1 || "" })); } catch {}
        if (!connected) return;
        const prevTimer = urlSendTimers.get(clientId);
        if (prevTimer) clearTimeout(prevTimer);
        urlSendTimers.set(clientId, setTimeout(() => {
          try {
            ws.send(JSON.stringify({ type: "url_update", clientId, url1: d.url1 || "", url2: d.url2 || "" }));
          } catch {}
        }, 350));
      });
      url1Wrap.appendChild(url1Label);
      url1Wrap.appendChild(url1);
      url1Wrap.appendChild(url1Open);

      const url2Wrap = document.createElement("div");
      url2Wrap.className = "url-edit";
      const url2Label = document.createElement("span");
      url2Label.className = "muted";
      url2Label.textContent = "URL2";
      const url2 = document.createElement("input");
      url2.type = "text";
      url2.className = "url-input";
      url2.placeholder = "https://...";
      url2.dataset.urlFor = seatKey;
      url2.dataset.urlSlot = "url2";
      url2.value = String(connected ? (s.url2 ?? d.url2 ?? "") : (d.url2 || ""));
      const url2Open = document.createElement("button");
      url2Open.textContent = "開く";
      url2Open.addEventListener("click", (e) => {
        e.stopPropagation();
        openUrlInNewTab(url2.value);
      });
      url2.addEventListener("click", (e) => e.stopPropagation());
      url2.addEventListener("compositionstart", () => { isMemoComposing = true; });
      url2.addEventListener("compositionend", () => { isMemoComposing = false; });
      url2.addEventListener("focus", () => {
        urlFocusState = {
          clientId: seatKey,
          slot: "url2",
          selectionStart: url2.selectionStart,
          selectionEnd: url2.selectionEnd,
          scrollLeft: url2.scrollLeft
        };
      });
      url2.addEventListener("blur", () => {
        if (!isRenderingStudents) urlFocusState = null;
      });
      url2.addEventListener("input", () => {
        const next = normalizeUrlValue(url2.value);
        if (next !== url2.value) url2.value = next;
        d.url2 = next;
        if (connected) {
          const cur = teacherState.get(clientId) || { logs: [] };
          cur.url2 = next;
          teacherState.set(clientId, cur);
        }
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        try { ws.send(JSON.stringify({ type: "seat_plan_update", seatIndex: i, url2: d.url2 || "" })); } catch {}
        if (!connected) return;
        const prevTimer = urlSendTimers.get(clientId);
        if (prevTimer) clearTimeout(prevTimer);
        urlSendTimers.set(clientId, setTimeout(() => {
          try {
            ws.send(JSON.stringify({ type: "url_update", clientId, url1: d.url1 || "", url2: d.url2 || "" }));
          } catch {}
        }, 350));
      });
      url2Wrap.appendChild(url2Label);
      url2Wrap.appendChild(url2);
      url2Wrap.appendChild(url2Open);

      fields.appendChild(url1Wrap);
      fields.appendChild(url2Wrap);

      row.appendChild(head);
      row.appendChild(fields);
      studentsEl.appendChild(row);
    }

    studentsEl.scrollTop = listScrollTop;
    if (memoFocusState && memoFocusState.clientId) {
      const el = studentsEl.querySelector(`input[data-memo-for="${memoFocusState.clientId}"]`);
      if (el) {
        el.focus();
        try { el.setSelectionRange(memoFocusState.selectionStart, memoFocusState.selectionEnd); } catch {}
        el.scrollLeft = memoFocusState.scrollLeft || 0;
      }
    }
    if (urlFocusState && urlFocusState.clientId && urlFocusState.slot) {
      const el = studentsEl.querySelector(`input[data-url-for="${urlFocusState.clientId}"][data-url-slot="${urlFocusState.slot}"]`);
      if (el) {
        el.focus();
        try { el.setSelectionRange(urlFocusState.selectionStart, urlFocusState.selectionEnd); } catch {}
        el.scrollLeft = urlFocusState.scrollLeft || 0;
      }
    }
    } finally {
      isRenderingStudents = false;
    }
  }

  // ---------- WS connect ----------
  let reconnectTimer = null;
  let reconnectAttempts = 0;
  function scheduleReconnect() {
    if (reconnectTimer) return;
    const delay = Math.min(10000, 1000 * Math.pow(1.7, reconnectAttempts));
    reconnectAttempts += 1;
    setStatus(`Disconnected... reconnecting (${Math.round(delay)}ms)`);
    reconnectTimer = setTimeout(() => {
      reconnectTimer = null;
      connect();
    }, delay);
  }

  function updateRoomInUrl(room) {
    try {
      const u = new URL(location.href);
      u.searchParams.set("role", role);
      u.searchParams.set("room", room);
      history.replaceState(null, "", u.toString());
    } catch {}
  }

  function closeSocketSilently() {
    if (!ws) return;
    try {
      ws.onopen = null;
      ws.onmessage = null;
      ws.onclose = null;
      ws.onerror = null;
      if (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING) ws.close();
    } catch {}
    ws = null;
  }
  function connect() {
    const room = (roomEl.value || "demo").trim();
    if (!room) return;
    let name = "Teacher";
    if (role === "teacher") {
      const count = normalizeSeatCount(nameEl?.value || localStorage.getItem("seminar_seat_count") || "20");
      if (nameEl) nameEl.value = String(count);
      setTeacherSeatCount(count);
    } else {
      if (nameEl) nameEl.value = filterDisplayName(nameEl.value);
      name = (nameEl.value || "").trim() || "Student";
    }
    localStorage.setItem("seminar_room", room);
    if (role === "student") localStorage.setItem("seminar_name", name);
    updateRoomInUrl(room);

    // QR link update
    if (qrLink) qrLink.href = `/qr.html?room=${encodeURIComponent(room)}`;

    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    const roomChanged = activeRoom && activeRoom !== room;
    activeRoom = room;
    closeSocketSilently();
    if (role === "student") clearStudentSeatDisplay();
    const connectId = ++activeConnectId;
    if (role === "teacher" && roomChanged) {
      teacherState.clear();
      selectedStudentId = null;
      teacherCodeEl.value = "";
      if (teacherProgramName) teacherProgramName.textContent = "";
      clearLogsUI();
      scheduleRenderStudents();
    }

    const wsProto = location.protocol === "https:" ? "wss:" : "ws:";
    ws = new WebSocket(`${wsProto}//${location.host}`);
    setStatus("Connecting...");

    ws.onopen = () => {
      if (connectId !== activeConnectId) return;
      setStatus("Connected");
      reconnectAttempts = 0;
      if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
      if (role === "teacher") appendLog(`[sys ${tsNow()}] connected room=${room}`);
      ws.send(JSON.stringify({
        type: "join",
        role,
        room,
        name,
        clientId: role === "student" ? clientId : null
      }));
      if (role === "teacher") {
        ws.send(JSON.stringify({ type: "seat_plan_update", count: teacherSeatCount }));
      }
      if (role === "student") {
        ws.send(JSON.stringify({ type: "code_update", code: codeEl.value || "" }));
        setStudentSignal(""); // reset on connect
      }
    };

    ws.onmessage = (ev) => {
      if (connectId !== activeConnectId) return;
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }

      if (msg.type === "room_state") {
        roomNameLocked = !!msg.nameLock;
        applyNameLock();
        if (role === "teacher" && teacherLockName) {
          teacherLockName.checked = !!roomNameLocked;
        }
        return;
      }

      if (msg.type === "resources_state") {
        roomResources = Array.isArray(msg.resources) ? msg.resources : [];
        // teacher can edit; others view only
        if (resourcesEditBtn) resourcesEditBtn.style.display = (role === "teacher" && !resourcesEditMode) ? "inline-block" : "none";
        if (!resourcesEditMode) renderResourcesView();
        return;
      }

      if (msg.type === "seat_plan_state" && role === "teacher") {
        applySeatPlanState(msg);
        return;
      }

      if (msg.type === "teacher_message_state") {
        const m = String(msg.message || "");
        applyTeacherMessageUI(m);
        if (role === "teacher" && teacherMsgInput && document.activeElement !== teacherMsgInput) {
          teacherMsgInput.value = m;
        }
        return;
      }

      if (msg.type === "seat_assigned" && role === "student") {
        applyStudentSeatFromServer(msg.seatIndex);
        return;
      }

      if (msg.type === "name_update_rejected" && role === "student") {
        if (msg.reason === "locked") {
          roomNameLocked = true;
          applyNameLock();
          appendLog("[warn] 講師が名前変更を禁止中のため、名前変更は反映されませんでした。");
        }
        return;
      }

      if (msg.type === "name_assigned" && role === "student") {
        const assigned = filterDisplayName(msg.name || "");
        if (assigned) {
          if (nameEl) nameEl.value = assigned;
          localStorage.setItem("seminar_name", assigned);
          appendLog(`[info] 同名がいたため、名前を「${assigned}」に調整しました。`);
        }
        return;
      }

      if (msg.type === "force_code" && role === "student") {
        const code = String(msg.code || "");
        codeEl.value = code;
        // share to teacher (programmatic set doesn't trigger input event)
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: "code_update", code, programName: getProgramNameSafe() }));
        }
        appendLog("[info] 講師がコードを書き戻しました（自動実行はしません）");
        return;
      }

      if (msg.type === "url_update" && role === "student") {
        applyStudentUrlState(msg.url1 || "", msg.url2 || "");
        return;
      }

      if (role === "teacher") {
        if (msg.type === "force_code_result") {
          if (writebackPendingTimer) { clearTimeout(writebackPendingTimer); writebackPendingTimer = null; }
          if (teacherWritebackSendBtn) teacherWritebackSendBtn.disabled = false;
          if (msg.ok) {
            setTeacherWritebackOpen(false);
            writebackTargetId = null;
          } else {
            const reason = msg.reason || "unknown";
            alert(`書き戻しに失敗しました: ${reason}`);
          }
        }
        if (msg.type === "snapshot") {
          teacherState.clear();
          (msg.students || []).forEach(s => teacherState.set(s.clientId, s));
          if (!seatAssignments.some(Boolean)) rebuildSeatAssignmentsFromState();
          appendLog(`[join ${tsNow()}] snapshot room=${roomEl?.value || ""} students=${(msg.students || []).length}`);
          scheduleRenderStudents();
        }
        if (msg.type === "program_update") {
          assignClientToSeat(msg.clientId);
          const s = teacherState.get(msg.clientId) || { logs: [] };
          s.programName = msg.programName || "";
          s.lastSeen = msg.lastSeen || s.lastSeen;
          teacherState.set(msg.clientId, s);
          scheduleRenderStudents();
        }
        if (msg.type === "signal_update") {
          assignClientToSeat(msg.clientId);
          const s = teacherState.get(msg.clientId) || { logs: [] };
          s.signal = msg.signal || "";
          s.lastSeen = msg.lastSeen || s.lastSeen;
          teacherState.set(msg.clientId, s);
          scheduleRenderStudents();
        }
        if (msg.type === "memo_update") {
          const idx = assignClientToSeat(msg.clientId);
          const s = teacherState.get(msg.clientId) || { logs: [] };
          s.memo = String(msg.memo || "");
          teacherState.set(msg.clientId, s);
          if (idx >= 0) getSeatDraft(idx).memo = s.memo || "";
          scheduleRenderStudents();
        }
        if (msg.type === "name_update") {
          assignClientToSeat(msg.clientId);
          const s = teacherState.get(msg.clientId) || { logs: [] };
          s.name = msg.name;
          s.lastSeen = msg.lastSeen;
          teacherState.set(msg.clientId, s);
          scheduleRenderStudents();
        }
        if (msg.type === "student_joined") {
          teacherState.set(msg.clientId, { name: msg.name, code: "", logs: [], memo: "", programName: "", url1: msg.url1 || "", url2: msg.url2 || "", lastSeen: msg.lastSeen });
          assignClientToSeat(msg.clientId, Number.isInteger(msg.seatIndex) ? msg.seatIndex : -1);
          const seatLabel = Number.isInteger(msg.seatIndex) ? String(msg.seatIndex + 1) : "?";
          appendLog(`[join ${tsNow()}] room=${roomEl?.value || ""} seat=${seatLabel} name=${msg.name || ""} id=${msg.clientId || ""}`);
          scheduleRenderStudents();
        }
        if (msg.type === "student_left") {
          assignClientToSeat(msg.clientId);
          const s = teacherState.get(msg.clientId) || {};
          s.lastSeen = msg.lastSeen;
          teacherState.set(msg.clientId, s);
          appendLog(`[left ${tsNow()}] room=${roomEl?.value || ""} name=${s.name || ""} id=${msg.clientId || ""}`);
          scheduleRenderStudents();
        }
        if (msg.type === "code_update") {
          assignClientToSeat(msg.clientId);
          const s = teacherState.get(msg.clientId) || { logs: [] };
          s.name = msg.name;
          s.code = msg.code;
          s.programName = msg.programName || s.programName || "";
          s.lastSeen = msg.lastSeen;
          teacherState.set(msg.clientId, s);

          if (selectedStudentId === msg.clientId) {
            teacherCodeEl.value = msg.code || "";
            if (teacherProgramName) {
              teacherProgramName.textContent = s.programName ? `プログラム名: ${s.programName}` : "";
            }
          }
          scheduleRenderStudents();
        }
        if (msg.type === "url_update") {
          const idx = assignClientToSeat(msg.clientId);
          const s = teacherState.get(msg.clientId) || { logs: [] };
          s.url1 = msg.url1 || "";
          s.url2 = msg.url2 || "";
          s.lastSeen = msg.lastSeen || s.lastSeen;
          teacherState.set(msg.clientId, s);
          if (idx >= 0) {
            const d = getSeatDraft(idx);
            d.url1 = s.url1 || "";
            d.url2 = s.url2 || "";
          }
          scheduleRenderStudents();
        }
        if (msg.type === "log") {
          assignClientToSeat(msg.clientId);
          const s = teacherState.get(msg.clientId) || { logs: [] };
          s.name = msg.name;
          s.logs = (s.logs || []).slice(-400);
          s.logs.push(msg.line);
          s.lastSeen = msg.lastSeen;
          teacherState.set(msg.clientId, s);
        
          const showAll = teacherShowAllLogs?.checked;
        
          if (showAll) {
            // 全員分を流す（誰のログか分かるように名前を付ける）
            appendLog(`[${s.name || "Student"}] ${msg.line}`);
          } else {
            // 選択者のみ表示（従来仕様）
            if (selectedStudentId === msg.clientId) appendLog(msg.line);
          }
        
          scheduleRenderStudents();
        }
        if (msg.type === "clear_logs") {
          assignClientToSeat(msg.clientId);
          const s = teacherState.get(msg.clientId);
          if (s) {
            s.logs = [];
            s.lastSeen = msg.lastSeen;
            teacherState.set(msg.clientId, s);
        
            const showAll = teacherShowAllLogs?.checked;
        
            if (showAll) {
              appendLog(`[${s.name || "Student"}] (logs cleared)`);
            } else {
              if (selectedStudentId === msg.clientId) clearLogsUI();
            }
        
            scheduleRenderStudents();
          }
        }
      }
    };

    ws.onclose = () => {
      if (connectId !== activeConnectId) return;
      ws = null;
      if (role === "teacher") appendLog(`[sys ${tsNow()}] disconnected room=${activeRoom || roomEl?.value || ""}`);
      scheduleReconnect();
    };
    ws.onerror = () => {
      if (connectId !== activeConnectId) return;
      if (role === "teacher") appendLog(`[sys ${tsNow()}] websocket error room=${activeRoom || roomEl?.value || ""}`);
      scheduleReconnect();
    };
  }

  connectBtn.addEventListener("click", () => connect());
  connect();
</script>
</body>
</html>
